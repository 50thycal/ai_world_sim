name: Check MVP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check desktop and phone UI
        run: CHROME_PATH="$(command -v google-chrome)" npm run check:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: test-results/
